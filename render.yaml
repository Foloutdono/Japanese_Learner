services:
  # The running backend is the dashboard's `Japanese_Learner`, in
  # Frankfurt, which this file did not create (the names differ). A
  # Blueprint made from this file would add a second backend beside it
  # rather than take it over, so the live service is changed in the
  # dashboard, and this file is kept saying the same.
  - type: web
    name: japanese-app-backend
    runtime: python
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # GET / is the smoke route (main.py); with it named here Render
    # restarts a wedged instance instead of routing to it.
    healthCheckPath: /
    # Was deliberately absent for a long time, and the reason is worth
    # keeping: on the free tier the instance sleeps after 15 idle
    # minutes and a cold start takes 30–60 s, which on a phone is the
    # first thing every visit feels. The frontend drew that wait
    # honestly (AppLoading, and a 45 s gate in App.jsx rather than the
    # 8 s default) but no amount of honesty makes it shorter — only a
    # plan that stays up does. Taken in the analytics wave, because a
    # boot that slow is the largest measurable leak above the funnel
    # everything else here is trying to widen.
    #
    # `app_open.boot_ms` (lib/track.js, emitted from the gate call in
    # App.jsx) is the figure this is meant to move. If it does not,
    # this line is not what was wrong.
    plan: starter
    disk:
      name: srs-data
      mountPath: /data
      sizeGB: 1
    # EXAM_AUDIO_DIR must be set to /data/exam_audio in the Render service's
    # environment variables (dashboard, not this file) so generated exam
    # audio survives deploys — see backend/.env.example and
    # backend/study/exam_tts.py.
    #
    # The disk above has to actually be attached to the SERVICE for that
    # to mean anything. It was not: the instance had no /data at all, so
    # every clip write raised PermissionError on mkdir("/data") and every
    # clip URL answered 500. The backend now survives that on its own
    # (writable-directory probe with a fallback, plus on-demand
    # re-synthesis), and says so in its startup log — an
    # "EXAM_AUDIO_DIR=... cannot be written to" line there means this
    # blueprint has not been synced onto the running service.
    envVars:
      # The voice engine below, reached over Render's private network.
      # `hostport` is host:port with no scheme; study/voice_engine.py
      # adds the http://. On the running service (see above) it is set
      # by hand to the voice service's internal address, host:port, as
      # that service's page shows it. Only this key is declared here: the
      # others (DATABASE_URL, EXAM_AUDIO_DIR...) live in the dashboard.
      - key: VOICEVOX_URL
        fromService:
          type: pserv
          name: voicevox-nemo
          property: hostport

  # ── 声: the voice engine (plan 121, docs/adr/0019) ───────────────
  # VOICEVOX Nemo, the stock image run unmodified (LGPL-3.0, credit
  # "VOICEVOX Nemo" -- THIRD_PARTY_NOTICES.md). A PRIVATE service: it has
  # no auth of its own, so it must never be reachable from outside;
  # only the backend above calls it. It keeps no state -- no disk, no
  # database -- so a restart costs a few seconds of loading and nothing
  # else. Frankfurt, pinned: the backend runs there, the private
  # network does not cross regions, and a service created with no
  # region lands in Oregon.
  - type: pserv
    name: voicevox-nemo
    runtime: image
    region: frankfurt
    image:
      # cpu-0.23.0, pinned by digest: the newest Nemo engine published
      # as an image (0.24.0 exists only as downloads), and an
      # image-backed service does not redeploy when a tag moves, so a
      # tag would pin nothing anyway. Listens on 50121, which Render
      # detects; nothing here names the port.
      url: docker.io/voicevox/voicevox_nemo_engine@sha256:0ff297cef582439227e79da3c1e5123a9186353fcaffbb2e8f04ed0864aca45d
    # Measured (docker, one thread, three voices loaded): 343 MB at peak
    # with the owner's voices (plan 121b; the first set peaked at 376 MB),
    # so Starter's 512 MB holds it. Starter's 0.5 CPU is the price: a
    # word takes ~2 s the first time and a 6 s dialogue turn ~10 s,
    # against ~1 s and ~5 s on Standard's 1 CPU. Every clip is made once
    # and cached for good, so the wait is paid once per word or line --
    # Standard is the move if the first-play wait on Android (which
    # always asks the server) turns out to be what learners notice.
    plan: starter
    envVars:
      # One thread per CPU the plan gives it (the engine's default is
      # half the HOST's cores, which is not what the container gets).
      - key: VV_CPU_NUM_THREADS
        value: "1"
      # Refuse the endpoints that write the engine's user dictionary and
      # settings: with no auth, anything that can reach it could
      # otherwise change how every clip is read.
      - key: VV_DISABLE_MUTABLE_API
        value: "1"
