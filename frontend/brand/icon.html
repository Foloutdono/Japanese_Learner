<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- The app icon's source (plan 065): 辻 in the serif on the sumi
     panel, a gold stripe under it — the masthead as a station sign.
     One glyph, not the three 日本語 used to set, so the type is sized
     up and the stripe pulled in to sit under it as an underline; the
     letter-spacing is gone because on a lone glyph it only adds a
     trailing gap and shifts the mark off centre.
     Rendered to brand/icon.png by scripts/render-icon.mjs with the same
     Noto Serif JP the app ships, then cut into every size by
     @vite-pwa/assets-generator (pwa-assets.config.js) and later by
     @capacitor/assets. The glyphs sit inside the central 80% so a
     maskable crop keeps them whole. -->
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-jp/japanese-700.css">
<style>
  html, body { margin: 0; background: #100e13; }
  .icon {
    position: relative;
    width: 1024px; height: 1024px;
    background: #100e13;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 44px;
  }
  .glyphs {
    font-family: 'Noto Serif JP', serif;
    font-weight: 700;
    font-size: 620px;
    line-height: 1;
    color: #f3ecdf;
    white-space: nowrap;
  }
  .stripe { width: 520px; height: 14px; background: #c99a3e; border-radius: 7px; }
</style>
</head>
<body>
  <div class="icon"><div class="glyphs">辻</div><div class="stripe"></div></div>
</body>
</html>
