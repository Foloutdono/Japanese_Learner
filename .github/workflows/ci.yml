name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: jp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/jp_test
      DEV_USER_ID: ci-test-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Load schema
        run: psql "$DATABASE_URL" -f backend/srs/data_structure.sql
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: src/lib/supabase.js calls createClient() at module
          # load, and @supabase/realtime-js throws "Node.js 20 detected
          # without native WebSocket support" the moment anything imports it
          # — which src/lib/ocr.test.js does, through lib/api. WebSocket is
          # only global from Node 22, and the library's own advice for
          # anything older is to install `ws` and inject it as a transport,
          # which would mean shipping a test-only argument in app code.
          # 22.x clears every tool's engine range too (vite ^20.19 ||
          # >=22.12, eslint ^20.19 || ^22.13 || >=24, vitest, stylelint) —
          # 20.19+ satisfied those as well, so WebSocket is the only reason
          # this moved.
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Lint CSS
        working-directory: frontend
        run: npm run lint:css
      - name: Check design scale
        working-directory: frontend
        run: npm run lint:scale
      - name: Check ink/ground
        working-directory: frontend
        run: npm run lint:ink
      # vitest runs two lanes; the browser one (28 files, including Guard 4)
      # needs a real chromium, which npm ci does not fetch. Without this the
      # lane silently does not run -- the step still fails, but only after
      # reporting "6 passed (34)", which reads like a pass at a glance.
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test
        working-directory: frontend
        run: npm test
