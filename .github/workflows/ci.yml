name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: jp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/jp_test
      DEV_USER_ID: ci-test-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Load schema
        run: psql "$DATABASE_URL" -f backend/srs/data_structure.sql
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20: package-lock.json is written by npm 11, and
          # npm 10 -- which is what Node 20 and Node 22 both ship --
          # rejects it outright ("Missing: @emnapi/core from lock
          # file", the unlisted peers of an optional wasm binding).
          # Node 20 is also deprecated on the runners, and vite 8
          # already asks for ^20.19 || >=22.12.
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Lint CSS
        working-directory: frontend
        run: npm run lint:css
      - name: Check design scale
        working-directory: frontend
        run: npm run lint:scale
      - name: Test
        working-directory: frontend
        run: npm test
