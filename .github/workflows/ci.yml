name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: jp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/jp_test
      DEV_USER_ID: ci-test-user
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        # numpy and ffmpeg are not the app's (requirements.txt is Render's
        # image): scripts/long_video_audio.py imports numpy inside its
        # functions and decodes the kana clips with ffmpeg, and
        # tests/test_long_video_audio.py checks its mix with both.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt numpy
      - name: Load schema
        run: psql "$DATABASE_URL" -f backend/srs/data_structure.sql
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22, not 20: src/lib/supabase.js calls createClient() at module
          # load, and @supabase/realtime-js throws "Node.js 20 detected
          # without native WebSocket support" the moment anything imports it
          # — which src/lib/ocr.test.js does, through lib/api. WebSocket is
          # only global from Node 22, and the library's own advice for
          # anything older is to install `ws` and inject it as a transport,
          # which would mean shipping a test-only argument in app code.
          # 22.x clears every tool's engine range too (vite ^20.19 ||
          # >=22.12, eslint ^20.19 || ^22.13 || >=24, vitest, stylelint) —
          # 20.19+ satisfied those as well, so WebSocket is the only reason
          # this moved.
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Lint CSS
        working-directory: frontend
        run: npm run lint:css
      - name: Check design scale
        working-directory: frontend
        run: npm run lint:scale
      - name: Check ink/ground
        working-directory: frontend
        run: npm run lint:ink
      # vitest runs seven lanes; the six browser ones (including Guard 4 and
      # the two desk lanes, plan 112) need a real chromium, which npm ci
      # does not fetch. Without this those lanes silently do not run -- the
      # step still fails, but only after reporting "6 passed (34)", which
      # reads like a pass at a glance.
      #
      # No --with-deps, deliberately: it runs apt-get update, and the runner
      # image's preinstalled Google Chrome apt source began serving a
      # Packages.gz whose hash disagrees with its own InRelease (2026-09-09),
      # so apt exits 100 and this step dies before a single test runs. The
      # browser binary comes from Playwright's own CDN either way; the system
      # libraries --with-deps would install are already on ubuntu-latest,
      # which ships Chrome preinstalled. If a future runner image drops them,
      # drop the broken repo rather than restoring --with-deps blind:
      #   sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install chromium
      # The browser lanes of the phone and the small screens only: browser,
      # phone, tablet, touch. The node lane is `frontend-node` below, and
      # the desk's three lanes (desktop, wide, short) are `frontend-desk`,
      # each on a runner of its own. Together on one 4-core runner they
      # starved one another: every run lost one or two tests to a 15 s
      # timeout or an animation or a route read before a frame had drawn,
      # a different test each time, 7 of 20 runs red on 2026-10-17. Apart
      # they pass here as they do alone.
      - name: Test (browser lanes - browser, phone, tablet, touch)
        working-directory: frontend
        run: npm run test:browsers:mobile
      # The production build was never exercised by CI: Vercel built it,
      # and a build-only break (a plugin config, an import that only the
      # bundler resolves) surfaced as a failed deploy after the merge.
      - name: Build
        working-directory: frontend
        run: npm run build

  # vitest's node lane (everything that is not *.{browser,phone,tablet,
  # touch,desktop,wide,short}.test.*), apart from the browser lanes so the
  # two never share cores; see the Test step of `frontend`. promote.yml
  # reads this job's result too, by this name.
  frontend-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22 for the same reason as `frontend`: the supabase client the
          # tests import needs a global WebSocket.
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test (node lane)
        working-directory: frontend
        run: npm run test:node

  # The desk's browser lanes (desktop, wide, short), apart from the others;
  # see the Test step of `frontend`. promote.yml reads this job's result
  # too, by this name.
  frontend-desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22 for the same reason as `frontend`.
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # Chromium from Playwright's CDN, no --with-deps: see `frontend`.
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Test (browser lanes - desktop, wide, short)
        working-directory: frontend
        run: npm run test:browsers:desk
