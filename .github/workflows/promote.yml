# The daily release: `main` is promoted to `production`, once.
#
# Render and Vercel deploy the `production` branch and nothing else, so a
# merge to `main` ships to no learner. Each deploy restarts the one-worker
# backend, and a learner opening the app during the restart sits on the
# boot gate (the `boot_timeout` events), so deploys happen once a day, at
# the quietest hour, rather than once per merge.
#
# What it does: it fast-forwards `production` to the newest commit of
# `main` whose CI passed, if that is ahead of it. Never a merge commit,
# never a force-push: `production` only ever holds commits `main` held
# first, so there is nothing to reconcile and a hotfix has one path (merge
# to `main`, press Run workflow). It creates `production` on its first run.
#
# Setup, once, in the dashboards (docs/release.md, "Web: the daily release"):
#   Render  -> the backend service -> Settings -> Build & Deploy -> Branch: production
#   Vercel  -> the project -> Settings -> Git -> Production Branch: production
#
# The schedule only starts working once this file is on the default
# branch; GitHub ignores cron in workflows that live only on a branch.
name: Promote to production

on:
  schedule:
    # 03:17 UTC, 05:17 in Paris: the learners are French and asleep. Off
    # the hour, since GitHub's cron queue is busiest at :00.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      ignore_ci:
        description: 'Promote even if CI is not green on main (a hotfix you accept the risk of)'
        type: boolean
        default: false
        required: false
      notice_minutes:
        description: 'Minutes learners are warned before the push, 0-60 (0: push at once, no warning)'
        type: number
        default: 10
        required: false

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: write
  checks: read

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Through the web origin, as every caller reaches the API (vercel.json).
      NOTICE_URL: https://japanese-learner-seven.vercel.app/api/release/notice
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Pick the newest commit of main whose CI passed
        id: pick
        run: |
          # The newest, not necessarily the head: a push to main whose CI
          # is still running, or flaked, waits for tomorrow (or a manual
          # run), and the commits before it that passed ship meanwhile.
          # Only merge commits carry the CI jobs (ci.yml runs on a
          # push to main), so walking the first parent is walking the
          # candidates, newest first.
          have_production=false
          if git ls-remote --exit-code --heads origin production >/dev/null; then
            git fetch origin production
            have_production=true
          fi
          pick=""
          if [ "${{ inputs.ignore_ci }}" = "true" ]; then
            pick=$(git rev-parse HEAD)
            echo "CI ignored on request: main's head, $pick."
          else
            for sha in $(git rev-list --first-parent -n 30 HEAD); do
              if [ "$have_production" = true ] && [ "$sha" = "$(git rev-parse origin/production)" ]; then
                echo "Reached production ($sha) before a newer green commit: nothing to ship."
                break
              fi
              ok=true
              for job in backend frontend frontend-node frontend-desk; do
                result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
                  --jq "[.check_runs[] | select(.name == \"$job\") | .conclusion] | first // \"missing\"")
                echo "$sha $job: $result"
                [ "$result" = "success" ] || ok=false
              done
              if [ "$ok" = true ]; then pick=$sha; break; fi
            done
            if [ -z "$pick" ] && [ "$have_production" = false ]; then
              echo "::error::No commit among main's last 30 has all four CI jobs green."
              exit 1
            fi
          fi
          if [ -z "$pick" ]; then
            echo "ship=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$have_production" = true ]; then
            if [ "$(git rev-parse origin/production)" = "$pick" ]; then
              echo "production is already at $pick: nothing to ship."
              echo "ship=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! git merge-base --is-ancestor origin/production "$pick"; then
              echo "::error::production holds commits that $pick lacks. Something was pushed to it by hand; merge it into main, then run this again."
              exit 1
            fi
            git log --oneline origin/production.."$pick" | head -50
          else
            echo "production does not exist yet: the first run creates it at $pick."
          fi
          echo "ship=true" >> "$GITHUB_OUTPUT"
          echo "sha=$pick" >> "$GITHUB_OUTPUT"

      # 工事 (plan 262): learners are told before the restart, not left to
      # wonder why the app stalls. The running backend is told the minute
      # of the push and says it on every answer (core/release_notice.py,
      # the docked note in UpdateToast.jsx); the restart clears it. Best
      # effort: without the RELEASE_NOTICE_TOKEN secret (and the same
      # variable on Render), or with the backend down, the release ships
      # as before, at once.
      - name: Warn learners
        id: notice
        if: steps.pick.outputs.ship == 'true'
        continue-on-error: true
        env:
          RELEASE_NOTICE_TOKEN: ${{ secrets.RELEASE_NOTICE_TOKEN }}
          # format(): a bare 0 would be falsy and fall through to the 10.
          MINUTES: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.notice_minutes) || '10' }}
        run: |
          if [ -z "$RELEASE_NOTICE_TOKEN" ] || [ "$MINUTES" -le 0 ]; then
            echo "No warning: $([ -z "$RELEASE_NOTICE_TOKEN" ] && echo 'RELEASE_NOTICE_TOKEN is not set' || echo 'notice_minutes is 0')."
            exit 0
          fi
          curl -fsS --max-time 30 -X POST "$NOTICE_URL" \
            -H "X-Release-Token: $RELEASE_NOTICE_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"in_minutes\": $MINUTES}"
          echo
          echo "announced=true" >> "$GITHUB_OUTPUT"
          echo "Learners warned; pushing in $MINUTES minutes."
          sleep $((MINUTES * 60))

      - name: Fast-forward production
        if: steps.pick.outputs.ship == 'true'
        run: |
          git push origin "${{ steps.pick.outputs.sha }}:refs/heads/production"
          echo "### Shipped" >> "$GITHUB_STEP_SUMMARY"
          echo "production is now at \`${{ steps.pick.outputs.sha }}\`." >> "$GITHUB_STEP_SUMMARY"

      # The push failed after learners were warned: take the warning down
      # rather than leave it standing until it expires.
      - name: Take the warning down
        if: failure() && steps.notice.outputs.announced == 'true'
        env:
          RELEASE_NOTICE_TOKEN: ${{ secrets.RELEASE_NOTICE_TOKEN }}
        run: |
          curl -fsS --max-time 30 -X DELETE "$NOTICE_URL" -H "X-Release-Token: $RELEASE_NOTICE_TOKEN" || true
